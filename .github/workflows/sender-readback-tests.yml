name: Native coverage readback ordering
on:
  push:
    branches: [dev]
    paths:
      - 'pc/stream-bridge-sender-provider-coverage*'
      - 'tests/test_stream_bridge_sender_readback_gpu.cpp'
      - '.github/workflows/sender-readback-tests.yml'
  pull_request:
    paths:
      - 'pc/stream-bridge-sender-provider-coverage*'
      - 'tests/test_stream_bridge_sender_readback_gpu.cpp'
      - '.github/workflows/sender-readback-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gpu-readback:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build actual GPU submission/query fixture and dispatch causal controls
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "SFNP_VS=%%i"
          if not defined SFNP_VS exit /b 1
          call "%SFNP_VS%\VC\Auxiliary\Build\vcvars64.bat" >nul
          if errorlevel 1 exit /b 1
          mkdir build
          cl /nologo /std:c++17 /EHsc /W4 /WX /I. tests/test_stream_bridge_sender_readback_gpu.cpp pc/stream-bridge-sender-provider-coverage-render.cpp /Fe:build\readback.exe /Fo:build\ /link d3d11.lib d3dcompiler.lib dxgi.lib dxguid.lib uuid.lib
          if errorlevel 1 exit /b 1
          python -c "from pathlib import Path; s=Path('pc/stream-bridge-sender-provider-coverage-render.cpp').read_text(); a='        nativeFlush(context);'; assert s.count(a)==1; Path('build/no-flush.cpp').write_text(s.replace(a,'        (void)nativeFlush;')); a='    const auto ready=nativeGetData(context,completion,'; assert s.count(a)==1; i=s.index(a); j=s.index(';',i); Path('build/no-query.cpp').write_text(s[:i]+'    (void)nativeGetData; completed=TRUE; const auto ready=S_OK'+s[j:])"
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX /I. /Ipc tests/test_stream_bridge_sender_readback_gpu.cpp build/no-flush.cpp /Fe:build\no-flush.exe /Fo:build\ /link d3d11.lib d3dcompiler.lib dxgi.lib dxguid.lib uuid.lib
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX /I. /Ipc tests/test_stream_bridge_sender_readback_gpu.cpp build/no-query.cpp /Fe:build\no-query.exe /Fo:build\ /link d3d11.lib d3dcompiler.lib dxgi.lib dxguid.lib uuid.lib
          if errorlevel 1 exit /b 1
      - name: Verify current-frame nonblocking availability with real full-size GPU resources
        shell: cmd
        run: |
          build\readback.exe >build\readback.log 2>&1
          set "SFNP_RESULT=%ERRORLEVEL%"
          type build\readback.log
          exit /b %SFNP_RESULT%
      - name: Require missing submission/completion dispatch to fail without assuming no-Flush GPU liveness
        shell: cmd
        run: |
          build\no-flush.exe >build\no-flush.log 2>&1
          set "SFNP_RESULT=%ERRORLEVEL%"
          type build\no-flush.log
          if "%SFNP_RESULT%"=="0" exit /b 1
          findstr /c:"active-MR production dispatch is copy" build\no-flush.log >nul
          if errorlevel 1 exit /b 1
          build\no-query.exe >build\no-query.log 2>&1
          set "SFNP_RESULT=%ERRORLEVEL%"
          type build\no-query.log
          if "%SFNP_RESULT%"=="0" exit /b 1
          findstr /c:"production readback must query its own exact completion event" build\no-query.log >nul
          if errorlevel 1 exit /b 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-size-native-readback-evidence
          path: build/*.log
