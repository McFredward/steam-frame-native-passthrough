name: Native shared-source alpha diagnostics
on:
  push:
    branches: [dev]
    paths:
      - 'pc/stream-bridge-source-alpha*'
      - 'pc/stream-bridge-sender-provider-coverage*'
      - 'pc/stream-bridge-sender-provider.cpp'
      - 'tests/test_stream_bridge_source_alpha*'
      - '.github/workflows/source-alpha-tests.yml'
  pull_request:
    paths:
      - 'pc/stream-bridge-source-alpha*'
      - 'pc/stream-bridge-sender-provider-coverage*'
      - 'pc/stream-bridge-sender-provider.cpp'
      - 'tests/test_stream_bridge_source_alpha*'
      - '.github/workflows/source-alpha-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check coherent bounded diagnostic publication
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -pthread -I. tests/test_stream_bridge_source_alpha_publication.cpp -o /tmp/source-alpha-publication
          /tmp/source-alpha-publication
  gpu:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build actual D3D11 source-alpha fixture
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "SFNP_VS=%%i"
          if not defined SFNP_VS exit /b 1
          call "%SFNP_VS%\VC\Auxiliary\Build\vcvars64.bat" >nul
          if errorlevel 1 exit /b 1
          mkdir build
          cl /nologo /std:c++17 /EHsc /W4 /WX /I. tests/test_stream_bridge_source_alpha_gpu.cpp /Fe:build\source-alpha.exe /Fo:build\ /link d3d11.lib dxgi.lib dxguid.lib uuid.lib
          if errorlevel 1 exit /b 1
      - name: Verify actual RGBA and BGRA readbacks without source mutation
        shell: cmd
        run: |
          build\source-alpha.exe >build\source-alpha.log 2>&1
          set "SFNP_RESULT=%ERRORLEVEL%"
          type build\source-alpha.log
          exit /b %SFNP_RESULT%
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-source-alpha-evidence
          path: build/source-alpha.log
