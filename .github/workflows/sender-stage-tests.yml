name: Exact native coverage stage ownership
on:
  push:
    branches: [dev]
    paths:
      - 'pc/stream-bridge-sender-provider-coverage*'
      - 'pc/stream-bridge-sender-provider-core.*'
      - 'pc/stream-bridge-wire-budget.h'
      - 'tests/test_stream_bridge_sender_stage_pipeline.cpp'
      - 'tests/test_stream_bridge_sender_provider_input.cpp'
      - 'tests/check_sender_continuity.py'
      - 'cmake/StreamBridge.cmake'
      - '.github/workflows/sender-stage-tests.yml'
  pull_request:
    paths:
      - 'pc/stream-bridge-sender-provider-coverage*'
      - 'pc/stream-bridge-sender-provider-core.*'
      - 'pc/stream-bridge-wire-budget.h'
      - 'tests/test_stream_bridge_sender_stage_pipeline.cpp'
      - 'tests/test_stream_bridge_sender_provider_input.cpp'
      - 'tests/check_sender_continuity.py'
      - 'cmake/StreamBridge.cmake'
      - '.github/workflows/sender-stage-tests.yml'
  workflow_dispatch:
    inputs:
      platform:
        description: Rerun only the affected platform
        type: choice
        options: [all, windows, linux]
        default: all
permissions:
  contents: read
jobs:
  stage-pipeline:
    strategy:
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.platform == 'windows' && '["windows-2025"]' || github.event_name == 'workflow_dispatch' && inputs.platform == 'linux' && '["ubuntu-24.04"]' || '["ubuntu-24.04","windows-2025"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned public NVENC header
        shell: bash
        run: |
          mkdir -p build/nvenc-sdk
          curl --fail --location --retry 3 --max-time 60 https://raw.githubusercontent.com/FFmpeg/nv-codec-headers/43d91706e097565f57b311e567f0219838bcc2f6/include/ffnvcodec/nvEncodeAPI.h -o build/nvenc-sdk/nvEncodeAPI.h
          echo 'be0c29a41ae3260fd016a9001fd959e747bac93ad21411759736abba4ffdea86  build/nvenc-sdk/nvEncodeAPI.h' | sha256sum --check --strict
      - name: Build and run production native source pipeline on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake -S . -B build/stages -DFRAME_STREAM_BRIDGE_ONLY=ON -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release -DSFNP_NVENC_SDK_DIRECTORY="$PWD/build/nvenc-sdk"
          cmake --build build/stages --parallel 4 --target test_stream_bridge_sender_stage_pipeline test_stream_bridge_sender_provider_input
          build/stages/test_stream_bridge_sender_stage_pipeline | tee build/stage-pipeline.log
          build/stages/test_stream_bridge_sender_provider_input | tee build/input-association.log
          build/stages/test_stream_bridge_sender_provider_input --legacy-codec | tee build/legacy-codec.log
      - name: Build and run same production native source pipeline on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "SFNP_VS=%%i"
          if not defined SFNP_VS exit /b 1
          call "%SFNP_VS%\VC\Auxiliary\Build\vcvars64.bat" >nul
          if errorlevel 1 exit /b 1
          clang-cl /nologo /TC /O2 /w /DZSTD_DISABLE_ASM /DZSTDLIB_VISIBILITY= /c third_party/zstd/zstd.c /Fo:build\zstd.obj
          if errorlevel 1 exit /b 1
          clang-cl /nologo /std:c++17 /EHsc /W4 /WX /DNOMINMAX /DWIN32_LEAN_AND_MEAN /I. /imsvcbuild/nvenc-sdk tests/test_stream_bridge_sender_stage_pipeline.cpp build\zstd.obj pc/stream-bridge-sender-provider-core.cpp pc/stream-bridge-sender.cpp bridge/stream_bridge_protocol.cpp bridge/stream_bridge_auth.cpp bridge/stream_bridge_frame.cpp bridge/stream_bridge_compression.cpp bridge/hevc_bridge_sei.cpp /Fe:build\stage-pipeline.exe /Fo:build\ /link
          if errorlevel 1 exit /b 1
          build\stage-pipeline.exe >build\stage-pipeline.log 2>&1
          set "SFNP_RESULT=%ERRORLEVEL%"
          type build\stage-pipeline.log
          if not "%SFNP_RESULT%"=="0" exit /b %SFNP_RESULT%
          clang-cl /nologo /std:c++17 /EHsc /W4 /WX /DNOMINMAX /DWIN32_LEAN_AND_MEAN /I. /imsvcbuild/nvenc-sdk tests/test_stream_bridge_sender_provider_input.cpp build\zstd.obj pc/stream-bridge-sender-provider-core.cpp pc/stream-bridge-sender.cpp bridge/stream_bridge_protocol.cpp bridge/stream_bridge_auth.cpp bridge/stream_bridge_frame.cpp bridge/stream_bridge_compression.cpp bridge/hevc_bridge_sei.cpp /Fe:build\input-association.exe /Fo:build\ /link
          if errorlevel 1 exit /b 1
          build\input-association.exe >build\input-association.log 2>&1
          set "SFNP_RESULT=%ERRORLEVEL%"
          type build\input-association.log
          if not "%SFNP_RESULT%"=="0" exit /b %SFNP_RESULT%
          build\input-association.exe --legacy-codec >build\legacy-codec.log 2>&1
          set "SFNP_RESULT=%ERRORLEVEL%"
          type build\legacy-codec.log
          exit /b %SFNP_RESULT%
      - name: Require cross-stage reader coupling to fail the deterministic pipeline
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p build/reader-coupled/pc
          python3 - <<'PY'
          from pathlib import Path
          source = Path('pc/stream-bridge-sender-provider-coverage-stages.h').read_text()
          needle = '    Claim capture(std::uintptr_t input)noexcept{\n        if(!input)return {};'
          assert source.count(needle) == 1
          # Model the forbidden old metadata ownership: any CPU reader blocks
          # otherwise independent source copies. Real callbacks, accepted native
          # receipts and all fixture scheduling remain unchanged.
          source = source.replace(needle, needle + '\n        for(const auto& slot:slots_)if((slot.word.load(std::memory_order_acquire)&PhaseMask)==static_cast<std::uint64_t>(Phase::Reading))return {};')
          Path('build/reader-coupled/pc/stream-bridge-sender-provider-coverage-stages.h').write_text(source)
          PY
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -Ibuild/reader-coupled -I. -isystem build/nvenc-sdk tests/test_stream_bridge_sender_stage_pipeline.cpp build/stages/libsfnp_stream_sender_boundary.a build/stages/libsfnp_stream_bridge.a -pthread -o build/reader-coupled-pipeline
          set +e
          build/reader-coupled-pipeline >build/reader-coupled.log 2>&1
          result=$?
          set -e
          cat build/reader-coupled.log
          test "$result" -eq 1
          grep -F 'bounded native producer has an unowned exact stage' build/reader-coupled.log
      - name: Require each former native availability barrier to fail exact-frame continuity
        if: runner.os == 'Linux'
        shell: bash
        run: python3 tests/check_sender_continuity.py --sdk build/nvenc-sdk --bridge-library build/stages/libsfnp_stream_bridge.a --output build/continuity-controls
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-stage-pipeline-${{ runner.os }}
          path: |
            build/stage-pipeline.log
            build/input-association.log
            build/continuity-controls/*.log
            build/continuity-controls/results.json
            build/reader-coupled.log
