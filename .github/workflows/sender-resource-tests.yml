# Exercise the Windows API directly; Wine capability refusals are not GPU proof.
name: Native Windows sender resource checks
on:
  push:
    branches: [dev]
    paths:
      - 'pc/stream-bridge-sender-provider-coverage*'
      - 'tests/test_stream_bridge_sender_shared_resource.cpp'
      - 'tests/test_stream_bridge_sender_provider_context.cpp'
      - 'tests/test_stream_bridge_sender_writable_context_shadow.cpp'
      - 'tests/test_stream_bridge_sender_context_layout.c'
      - '.github/workflows/sender-resource-tests.yml'
  pull_request:
    paths:
      - 'pc/stream-bridge-sender-provider-coverage*'
      - 'tests/test_stream_bridge_sender_shared_resource.cpp'
      - 'tests/test_stream_bridge_sender_provider_context.cpp'
      - 'tests/test_stream_bridge_sender_writable_context_shadow.cpp'
      - 'tests/test_stream_bridge_sender_context_layout.c'
      - '.github/workflows/sender-resource-tests.yml'
  workflow_dispatch:
    inputs:
      focus:
        description: Focused Windows production check
        type: choice
        options: [shadow, context, all]
        default: shadow

permissions:
  contents: read

concurrency:
  group: sender-resource-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-resource:
    if: github.event_name == 'workflow_dispatch' && inputs.focus == 'all'
    runs-on: windows-2025
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Compile the actual production resource matcher with the Windows SDK
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "SFNP_VS=%%i"
          if not defined SFNP_VS exit /b 1
          call "%SFNP_VS%\VC\Auxiliary\Build\vcvars64.bat" >nul
          if errorlevel 1 exit /b 1
          mkdir build
          cl /nologo /std:c++17 /EHsc /W4 /WX /I. tests/test_stream_bridge_sender_shared_resource.cpp pc/stream-bridge-sender-provider-coverage-render.cpp /Fe:build\shared-resource.exe /Fo:build\ /link d3d11.lib dxgi.lib dxguid.lib uuid.lib
          if errorlevel 1 exit /b 1
      - name: Verify metadata guards and independently opened native D3D11 resources
        shell: cmd
        run: |
          build\shared-resource.exe --metadata >build\shared-resource-metadata.log 2>&1
          set "SFNP_RESULT=%ERRORLEVEL%"
          type build\shared-resource-metadata.log
          if not "%SFNP_RESULT%"=="0" exit /b %SFNP_RESULT%
          build\shared-resource.exe --gpu >build\shared-resource-gpu.log 2>&1
          set "SFNP_RESULT=%ERRORLEVEL%"
          type build\shared-resource-gpu.log
          if "%SFNP_RESULT%"=="77" (
            echo ::notice::The hosted adapter cannot provide native shared D3D11 resources. This is an unsupported capability, not GPU validation.
            exit /b 0
          )
          exit /b %SFNP_RESULT%
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-shared-resource-evidence
          path: build/shared-resource-*.log
  context-observer:
    # Retain the older production observer control as an explicit focused run.
    # The independent shadow experiment does not certify that rejected route.
    if: github.event_name == 'workflow_dispatch' && inputs.focus != 'shadow'
    runs-on: windows-2025
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned public SDK headers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/nvenc-sdk | Out-Null
          Invoke-WebRequest 'https://raw.githubusercontent.com/FFmpeg/nv-codec-headers/43d91706e097565f57b311e567f0219838bcc2f6/include/ffnvcodec/nvEncodeAPI.h' -OutFile build/nvenc-sdk/nvEncodeAPI.h
          Invoke-WebRequest 'https://raw.githubusercontent.com/ValveSoftware/openvr/0924064316de3effbcd1acf1e309182a2deb1c05/headers/openvr_driver.h' -OutFile build/nvenc-sdk/openvr_driver.h
          foreach ($pin in @(@('nvEncodeAPI.h','be0c29a41ae3260fd016a9001fd959e747bac93ad21411759736abba4ffdea86'),@('openvr_driver.h','1036efe998d63e82d1d3db2b32a2f58df4a8eeaf5280f50aaf28220ff60a40ab'))) {
            if ((Get-FileHash ('build/nvenc-sdk/'+$pin[0])).Hash.ToLowerInvariant() -ne $pin[1]) { throw ('SDK pin mismatch: '+$pin[0]) }
          }
      - name: Compile actual production context observer
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "SFNP_VS=%%i"
          if not defined SFNP_VS exit /b 1
          call "%SFNP_VS%\VC\Auxiliary\Build\vcvars64.bat" >nul
          if errorlevel 1 exit /b 1
          clang-cl /nologo /std:c++17 /EHsc /W4 /WX /DNOMINMAX /DWIN32_LEAN_AND_MEAN /I. /imsvcbuild/nvenc-sdk tests/test_stream_bridge_sender_provider_context.cpp pc/stream-bridge-sender-provider-coverage.cpp pc/stream-bridge-sender-provider-coverage-render.cpp pc/stream-bridge-sender-provider-directmode.cpp pc/stream-bridge-sender-provider-core.cpp pc/stream-bridge-sender.cpp bridge/stream_bridge_protocol.cpp bridge/stream_bridge_auth.cpp bridge/stream_bridge_frame.cpp bridge/stream_bridge_capacity.cpp bridge/stream_bridge_credentials.cpp bridge/stream_bridge_control.cpp receiver/stream_bridge_receiver.cpp bridge/hevc_bridge_sei.cpp /Fe:build\native-context.exe /Fo:build\ /link d3d11.lib d3dcompiler.lib dxgi.lib dxguid.lib uuid.lib bcrypt.lib ws2_32.lib advapi32.lib
          if errorlevel 1 exit /b 1
      - name: Exercise real context dispatch from a separate rendering thread
        shell: cmd
        run: |
          build\native-context.exe >build\native-context.log 2>&1
          set "SFNP_RESULT=%ERRORLEVEL%"
          type build\native-context.log
          if not "%SFNP_RESULT%"=="0" exit /b %SFNP_RESULT%
          build\native-context.exe --protection-change >build\native-context-protection-change.log 2>&1
          set "SFNP_RESULT=%ERRORLEVEL%"
          type build\native-context-protection-change.log
          exit /b %SFNP_RESULT%
      - name: Prepare the single causal control without cold initialization
        shell: pwsh
        run: |
          $source = Get-Content pc/stream-bridge-sender-provider-coverage.cpp -Raw
          $needle = 'context->Draw(0,0);'
          if ([regex]::Matches($source, [regex]::Escape($needle)).Count -ne 1) { throw 'Cold initialization control must change exactly one production operation' }
          $source.Replace($needle, '/* causal control: omit cold Draw only */') | Set-Content build/coverage-no-warmup.cpp -Encoding utf8NoBOM
      - name: Compile the identical production fixture with only cold Draw removed
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "SFNP_VS=%%i"
          if not defined SFNP_VS exit /b 1
          call "%SFNP_VS%\VC\Auxiliary\Build\vcvars64.bat" >nul
          if errorlevel 1 exit /b 1
          clang-cl /nologo /std:c++17 /EHsc /W4 /WX /DNOMINMAX /DWIN32_LEAN_AND_MEAN /I. /Ipc /imsvcbuild/nvenc-sdk tests/test_stream_bridge_sender_provider_context.cpp build/coverage-no-warmup.cpp pc/stream-bridge-sender-provider-coverage-render.cpp pc/stream-bridge-sender-provider-directmode.cpp pc/stream-bridge-sender-provider-core.cpp pc/stream-bridge-sender.cpp bridge/stream_bridge_protocol.cpp bridge/stream_bridge_auth.cpp bridge/stream_bridge_frame.cpp bridge/stream_bridge_capacity.cpp bridge/stream_bridge_credentials.cpp bridge/stream_bridge_control.cpp receiver/stream_bridge_receiver.cpp bridge/hevc_bridge_sei.cpp /Fe:build\native-context-no-warmup.exe /Fo:build\ /link d3d11.lib d3dcompiler.lib dxgi.lib dxguid.lib uuid.lib bcrypt.lib ws2_32.lib advapi32.lib
          if errorlevel 1 exit /b 1
      - name: Prove the control loses hooks on the first native Draw
        shell: pwsh
        run: |
          & build/native-context-no-warmup.exe *>build/native-context-no-warmup.log
          $result = $LASTEXITCODE
          $log = Get-Content build/native-context-no-warmup.log -Raw
          Write-Host $log
          if ($result -ne 1 -or $log -notmatch 'cold production snapshot verifies actual current dispatch' -or $log -notmatch 'after first Draw:[^\r\n]*slots=0') { throw 'Causal control did not reproduce the exact pre-fix dispatch loss' }
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-context-evidence
          path: build/native-context*.log

  writable-context-shadow:
    if: github.event_name != 'workflow_dispatch' || inputs.focus == 'shadow' || inputs.focus == 'all'
    runs-on: windows-2025
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Compile independent full-public-ABI writable shadow experiment
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "SFNP_VS=%%i"
          if not defined SFNP_VS exit /b 1
          call "%SFNP_VS%\VC\Auxiliary\Build\vcvars64.bat" >nul
          if errorlevel 1 exit /b 1
          mkdir build
          cl /nologo /TC /W4 /WX /DNOMINMAX /DWIN32_LEAN_AND_MEAN /c tests/test_stream_bridge_sender_context_layout.c /Fobuild\context-layout.obj
          if errorlevel 1 exit /b 1
          clang-cl /nologo /std:c++17 /EHsc /W4 /WX /DNOMINMAX /DWIN32_LEAN_AND_MEAN tests/test_stream_bridge_sender_writable_context_shadow.cpp build\context-layout.obj /Fe:build\writable-context-shadow.exe /Fo:build\ /link d3d11.lib d3dcompiler.lib dxgi.lib dxguid.lib uuid.lib
          if errorlevel 1 exit /b 1
      - name: Run actual WARP Draw Copy Readback Getter Flush and protection transitions
        shell: cmd
        run: |
          build\writable-context-shadow.exe >build\writable-context-shadow.log 2>&1
          set "SFNP_RESULT=%ERRORLEVEL%"
          type build\writable-context-shadow.log
          if "%SFNP_RESULT%"=="77" echo ::error::The hosted WARP or same-pointer public API is unavailable. No shadow GPU proof was obtained.
          exit /b %SFNP_RESULT%
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-writable-context-shadow-experiment
          path: build/writable-context-shadow.log
