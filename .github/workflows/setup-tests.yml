name: PC and Frame setup checks
on:
  push:
    branches: [dev]
    paths:
      - 'get.ps1'
      - 'get.sh'
      - 'get-preview.*'
      - 'setup/**'
      - 'tools/package_stream_bridge.py'
      - 'tools/package_stream_link_setup.py'
      - 'tools/package_setup_inspection.py'
      - 'tools/package_setup_manager.py'
      - 'tools/native_passthrough_setup.py'
      - 'tools/package_setup_dependencies.py'
      - 'packaging/setup-*.json'
      - 'tests/test_embedded_setup_runtime.py'
      - 'tests/test_stream_bridge_install.py'
      - 'tests/test_setup_session.py'
      - 'tests/test_setup_log.py'
      - 'tests/test_package_stream_bridge.py'
      - 'tests/test_steam_link_setup.py'
      - 'tests/test_setup_bootstrap.py'
      - 'tests/test_setup_ui.py'
      - 'tests/test_setup_dependencies.py'
      - '.github/workflows/setup-tests.yml'
  pull_request:
    paths:
      - 'get.ps1'
      - 'get.sh'
      - 'get-preview.*'
      - 'setup/**'
      - 'tools/package_stream_bridge.py'
      - 'tools/package_stream_link_setup.py'
      - 'tools/package_setup_inspection.py'
      - 'tools/package_setup_manager.py'
      - 'tools/native_passthrough_setup.py'
      - 'tools/package_setup_dependencies.py'
      - 'packaging/setup-*.json'
      - 'tests/test_embedded_setup_runtime.py'
      - 'tests/test_stream_bridge_install.py'
      - 'tests/test_setup_session.py'
      - 'tests/test_setup_log.py'
      - 'tests/test_package_stream_bridge.py'
      - 'tests/test_steam_link_setup.py'
      - 'tests/test_setup_bootstrap.py'
      - 'tests/test_setup_ui.py'
      - 'tests/test_setup_dependencies.py'
      - '.github/workflows/setup-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: setup-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Actual wizard, temporary remote agent, and bootstrap fixtures
        run: |
          bash -n get.sh get-preview.sh setup/patch-steam-link.sh
          python -B tests/test_steam_link_setup.py
          python -B tests/test_stream_bridge_install.py
          python -B tests/test_setup_session.py
          python -B tests/test_setup_log.py
          python -B tests/test_package_stream_bridge.py
          python -B tests/test_setup_bootstrap.py
          python -B tests/test_setup_ui.py
          python -B tests/test_setup_dependencies.py
  windows-bootstrap:
    runs-on: windows-2025
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Actual Windows PowerShell archive parser and bootstrap fixtures
        shell: powershell
        run: python -B tests/test_setup_bootstrap.py --pwsh "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe"
      - name: Session reuse and persistent failure logs on Windows
        shell: powershell
        run: |
          python -B tests/test_setup_session.py
          if ($LASTEXITCODE -ne 0) { throw 'SSH session checks failed.' }
          python -B tests/test_setup_log.py
          if ($LASTEXITCODE -ne 0) { throw 'Setup log checks failed.' }
      - name: Execute the actual packaged portable Python without Frame access
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = Get-Content packaging/setup-python.json -Raw | ConvertFrom-Json
          $archive = Join-Path $env:RUNNER_TEMP 'python-embed.zip'
          & curl.exe --fail --silent --show-error --proto '=https' --max-time 60 --max-filesize 16777216 --output $archive $pin.source_url
          if ($LASTEXITCODE -ne 0 -or (Get-Item $archive).Length -ne $pin.bytes -or (Get-FileHash $archive).Hash.ToLowerInvariant() -cne $pin.sha256) { throw 'Official Python pin differs.' }
          # Only the public Python archive: compare actual Win32 stat/fstat fields
          # when diagnosing runtime-specific file identity representations.
          @'
          import json, os, sys
          from pathlib import Path
          path = Path(sys.argv[1]); before = path.stat()
          with path.open('rb') as stream:
              opened = os.fstat(stream.fileno())
          fields = ('st_dev', 'st_ino', 'st_mode', 'st_nlink', 'st_uid', 'st_gid', 'st_size', 'st_mtime_ns', 'st_ctime_ns')
          print(json.dumps({'python':sys.version, 'public_archive_stat_differences':{name:[getattr(before,name),getattr(opened,name)] for name in fields if getattr(before,name)!=getattr(opened,name)}}))
          '@ | python -B - $archive
          $package = Join-Path $env:RUNNER_TEMP 'setup-inspection.zip'
          $sshPin = Get-Content packaging/setup-openssh.json -Raw | ConvertFrom-Json
          $sshArchive = Join-Path $env:RUNNER_TEMP 'openssh-portable.zip'
          & curl.exe --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --max-time 60 --max-filesize 16777216 --output $sshArchive $sshPin.source_url
          if ($LASTEXITCODE -ne 0 -or (Get-Item $sshArchive).Length -ne $sshPin.bytes -or (Get-FileHash $sshArchive).Hash.ToLowerInvariant() -cne $sshPin.sha256) { throw 'Official OpenSSH pin differs.' }
          python -B tools/package_setup_inspection.py --python-zip $archive --openssh-zip $sshArchive --output $package
          if ($LASTEXITCODE -ne 0) { throw 'Inspection packaging failed.' }
          $tokens=$null; $parseErrors=$null
          $ast=[Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'get.ps1'),[ref]$tokens,[ref]$parseErrors)
          if ($parseErrors.Count -ne 0) { throw 'Bootstrap syntax error.' }
          $previewAst=[Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'get-preview.ps1'),[ref]$tokens,[ref]$parseErrors)
          if ($parseErrors.Count -ne 0) { throw 'Preview launcher syntax error.' }
          $functions=$ast.FindAll({param($node) $node -is [Management.Automation.Language.FunctionDefinitionAst]},$true)
          foreach ($function in $functions) { Invoke-Expression $function.Extent.Text }
          $target = Join-Path $env:RUNNER_TEMP 'actual-inspection-package'
          [void][IO.Directory]::CreateDirectory($target)
          $runtime = Expand-SfnpPackage $package $target $true
          & (Join-Path $target $runtime) -I -B tests/test_embedded_setup_runtime.py --package $target
          if ($LASTEXITCODE -ne 0) { throw 'Actual embedded setup runtime failed.' }
          & (Join-Path $target $runtime) -I -B tests/test_setup_ui.py
          if ($LASTEXITCODE -ne 0) { throw 'Actual embedded setup presentation failed.' }

      - name: Actual packaged management mode (no Frame contact or removal)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'python-embed.zip'
          $sshArchive = Join-Path $env:RUNNER_TEMP 'openssh-portable.zip'
          $package = Join-Path $env:RUNNER_TEMP 'setup-manager.zip'
          python -B tools/package_setup_manager.py --python-zip $archive --openssh-zip $sshArchive --output $package
          if ($LASTEXITCODE -ne 0) { throw 'Management packaging failed.' }
          $target = Join-Path $env:RUNNER_TEMP 'actual-manager-package'
          [void][IO.Directory]::CreateDirectory($target)
          $tokens=$null; $parseErrors=$null
          $ast=[Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'get.ps1'),[ref]$tokens,[ref]$parseErrors)
          if ($parseErrors.Count -ne 0) { throw 'Bootstrap syntax error.' }
          foreach ($fn in $ast.FindAll({param($node) $node -is [Management.Automation.Language.FunctionDefinitionAst]},$true)) { Invoke-Expression $fn.Extent.Text }
          $runtime = Expand-SfnpPackage $package $target $false $true
          & (Join-Path $target $runtime) -I -B tests/test_embedded_setup_runtime.py --package $target --manager
          if ($LASTEXITCODE -ne 0) { throw 'Actual embedded management runtime failed.' }
