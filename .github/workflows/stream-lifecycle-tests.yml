name: Stream connection lifecycle checks
on:
  push:
    branches: [dev]
    paths:
      - 'bridge/stream_bridge_control.*'
      - 'pc/stream-bridge-sender-provider-core.*'
      - 'pc/stream-bridge-wire-budget.h'
      - 'tests/check_sender_wire_budget.py'
      - 'pc/stream-bridge-sender-provider-runtime.*'
      - 'receiver/stream_bridge_native_runtime.*'
      - 'receiver/stream_bridge_native_decode.*'
      - 'receiver/stream_bridge_local.*'
      - 'pc/stream-bridge-sender-provider-coverage*'
      - 'tests/test_stream_bridge_control.cpp'
      - 'tests/test_stream_bridge_sender_provider*.cpp'
      - 'tests/stream_bridge_native_runtime_test.cpp'
      - 'tests/stream_bridge_native_decode_test.cpp'
      - 'tests/stream_bridge_local_test.cpp'
      - 'tests/test_stream_bridge_sender_coverage_gates.cpp'
      - 'cmake/StreamBridge.cmake'
      - '.github/workflows/stream-lifecycle-tests.yml'
  pull_request:
    paths:
      - 'bridge/stream_bridge_control.*'
      - 'pc/stream-bridge-sender-provider-core.*'
      - 'pc/stream-bridge-wire-budget.h'
      - 'tests/check_sender_wire_budget.py'
      - 'pc/stream-bridge-sender-provider-runtime.*'
      - 'receiver/stream_bridge_native_runtime.*'
      - 'receiver/stream_bridge_native_decode.*'
      - 'receiver/stream_bridge_local.*'
      - 'pc/stream-bridge-sender-provider-coverage*'
      - 'tests/test_stream_bridge_control.cpp'
      - 'tests/test_stream_bridge_sender_provider*.cpp'
      - 'tests/stream_bridge_native_runtime_test.cpp'
      - 'tests/stream_bridge_native_decode_test.cpp'
      - 'tests/stream_bridge_local_test.cpp'
      - 'tests/test_stream_bridge_sender_coverage_gates.cpp'
      - 'cmake/StreamBridge.cmake'
      - '.github/workflows/stream-lifecycle-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stream-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the exact reviewed public SDK header
        run: |
          mkdir -p build/nvenc-sdk
          curl --fail --location --retry 3 --max-time 60 https://raw.githubusercontent.com/FFmpeg/nv-codec-headers/43d91706e097565f57b311e567f0219838bcc2f6/include/ffnvcodec/nvEncodeAPI.h -o build/nvenc-sdk/nvEncodeAPI.h
          echo 'be0c29a41ae3260fd016a9001fd959e747bac93ad21411759736abba4ffdea86  build/nvenc-sdk/nvEncodeAPI.h' | sha256sum --check --strict
          curl --fail --location --retry 3 --max-time 60 https://raw.githubusercontent.com/ValveSoftware/openvr/0924064316de3effbcd1acf1e309182a2deb1c05/headers/openvr_driver.h -o build/nvenc-sdk/openvr_driver.h
          echo '1036efe998d63e82d1d3db2b32a2f58df4a8eeaf5280f50aaf28220ff60a40ab  build/nvenc-sdk/openvr_driver.h' | sha256sum --check --strict
      - name: Build the affected production control and encoder boundaries
        run: |
          cmake -S . -B build/lifecycle -DFRAME_STREAM_BRIDGE_ONLY=ON -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release -DSFNP_NVENC_SDK_DIRECTORY="$PWD/build/nvenc-sdk"
          cmake --build build/lifecycle --parallel 4 --target test_stream_bridge_control test_stream_bridge_native_runtime test_stream_bridge_native_decode test_stream_bridge_local test_stream_bridge_sender_provider test_stream_bridge_sender_provider_input test_stream_bridge_sender_provider_runtime test_stream_bridge_sender_coverage_gates
      - name: Require the original missing-budget causal control to fail
        run: python3 tests/check_sender_wire_budget.py --sdk "$PWD/build/nvenc-sdk" --bridge-library "$PWD/build/lifecycle/libsfnp_stream_bridge.a" --output "$PWD/build/wire-budget-control"
      - name: Exercise actual TCP admission, reconfiguration and frame receipts
        run: ctest --test-dir build/lifecycle --output-on-failure --parallel 4 -R '^stream_bridge_(control|native_runtime|native_decode|local|sender_coverage_gates|sender_provider(_input(_legacy)?|_runtime)?)$'
